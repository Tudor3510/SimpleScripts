server {
    listen 8273;
    listen [::]:8273;

    server_name _;

    root /home/tudor/SimpleWebsites/redirect-following-file-proxy;
    index index.html;

    # Execute only api.php through PHP-FPM
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        fastcgi_param HOME /home/tudor;

        fastcgi_buffering off;
        fastcgi_cache off;
    }

    # Block the vendor directory
    location = /vendor {
        return 404;
    }

    location ^~ /vendor/ {
        return 404;
    }

    # Block sensitive files
    location ~* ^/(\.gitignore|composer\.json|composer\.lock|composer\.phar|send_post\.py)$ {
        return 404;
    }

    # Block all other PHP files
    location ~* \.php(?:/|$) {
        return 404;
    }

    # Serve .mjs files as JavaScript (case-insensitive)
    location ~* \.mjs$ {
        types {}
        default_type text/javascript;
        try_files $uri =404;
    }

    # Serve everything else statically
    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }
}
